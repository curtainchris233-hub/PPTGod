<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 220" preserveAspectRatio="xMaxYMax slice" fill="none">
  <defs>
    <linearGradient id="gl-peaks-mask-h" x1="0" y1="0" x2="960" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#000000" />
      <stop offset="18%" stop-color="#1A1A1A" />
      <stop offset="42%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>
    <mask id="gl-peaks-fade">
      <rect width="960" height="220" fill="url(#gl-peaks-mask-h)" />
    </mask>
    <linearGradient id="gl-peaks-far" x1="480" y1="68" x2="540" y2="220" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#D7E8FA" stop-opacity="0.56" />
      <stop offset="100%" stop-color="#EDF5FD" stop-opacity="0.08" />
    </linearGradient>
    <linearGradient id="gl-peaks-mid-light" x1="420" y1="74" x2="480" y2="210" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.82" />
      <stop offset="100%" stop-color="#EAF3FC" stop-opacity="0.1" />
    </linearGradient>
    <linearGradient id="gl-peaks-mid-shade" x1="560" y1="74" x2="640" y2="210" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#C3DDF8" stop-opacity="0.58" />
      <stop offset="100%" stop-color="#E6F1FC" stop-opacity="0.06" />
    </linearGradient>
    <linearGradient id="gl-peaks-hero-light" x1="690" y1="18" x2="640" y2="205" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.94" />
      <stop offset="58%" stop-color="#EEF6FF" stop-opacity="0.62" />
      <stop offset="100%" stop-color="#F0F6FC" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="gl-peaks-hero-shade" x1="770" y1="18" x2="860" y2="205" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#A8CEF6" stop-opacity="0.66" />
      <stop offset="56%" stop-color="#CCE2F9" stop-opacity="0.38" />
      <stop offset="100%" stop-color="#F0F6FC" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="gl-peaks-secondary-light" x1="875" y1="48" x2="860" y2="205" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.82" />
      <stop offset="100%" stop-color="#E7F2FD" stop-opacity="0.05" />
    </linearGradient>
    <linearGradient id="gl-peaks-secondary-shade" x1="922" y1="48" x2="960" y2="205" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#B9D7F7" stop-opacity="0.58" />
      <stop offset="100%" stop-color="#E9F3FC" stop-opacity="0.06" />
    </linearGradient>
    <linearGradient id="gl-peaks-front-mist" x1="740" y1="126" x2="740" y2="220" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.68" />
      <stop offset="100%" stop-color="#F0F6FC" stop-opacity="0.12" />
    </linearGradient>
    <linearGradient id="gl-peaks-bottom-dissolve" x1="0" y1="138" x2="0" y2="220" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F0F6FC" stop-opacity="0" />
      <stop offset="68%" stop-color="#F0F6FC" stop-opacity="0.72" />
      <stop offset="100%" stop-color="#F0F6FC" stop-opacity="1" />
    </linearGradient>
  </defs>

  <g mask="url(#gl-peaks-fade)">
    <!-- 1. Far Atmospheric Alpine Ridge -->
    <path
      d="M150 220L275 156L348 168L455 104L532 132L632 82L718 118L828 62L960 112V220H150Z"
      fill="url(#gl-peaks-far)"
    />

    <!-- 2. Mid-Left Soft Snow Shoulder -->
    <polygon points="332,220 512,86 544,142 478,220" fill="url(#gl-peaks-mid-light)" />
    <polygon points="512,86 672,220 478,220 544,142" fill="url(#gl-peaks-mid-shade)" />
    <polygon points="512,86 558,156 544,142" fill="#9BC6F2" fill-opacity="0.22" />

    <!-- 3. Primary Focal Glacier Peak -->
    <polygon points="552,220 765,20 742,102 694,142 666,220" fill="url(#gl-peaks-hero-light)" />
    <polygon points="765,20 946,220 666,220 694,142 742,102" fill="url(#gl-peaks-hero-shade)" />
    <polygon points="765,20 818,124 776,146 742,102" fill="#94C0F0" fill-opacity="0.24" />
    <polygon points="765,20 742,102 710,94" fill="#FFFFFF" fill-opacity="0.52" />

    <!-- 4. Right Edge Secondary Peak & Low Frost Mist Ridge -->
    <polygon points="820,220 918,48 906,126 878,220" fill="url(#gl-peaks-secondary-light)" />
    <polygon points="918,48 960,98 960,220 878,220 906,126" fill="url(#gl-peaks-secondary-shade)" />
    <path
      d="M490 220L616 146L706 168L812 128L910 158L960 144V220H490Z"
      fill="url(#gl-peaks-front-mist)"
    />
  </g>

  <!-- Seamless Bottom Edge Dissolve into #F0F6FC -->
  <rect x="0" y="138" width="960" height="82" fill="url(#gl-peaks-bottom-dissolve)" />
</svg>
