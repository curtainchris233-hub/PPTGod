services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: pptgod
      POSTGRES_USER: pptgod
      POSTGRES_PASSWORD: pptgod
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "pptgod", "-d", "pptgod"]
      interval: 5s
      timeout: 3s
      retries: 10

  pptgod:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: ${PPTGOD_DOCKER_DATABASE_URL:-postgresql://pptgod:pptgod@postgres:5432/pptgod}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
